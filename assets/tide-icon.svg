<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- TIDE: a line of text that turned out to be water, with the caret still
       sitting at the end of it. A second swell underneath for depth. Both lines
       end on the same edge so the caret closes the mark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252829"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="swell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6ae0"/>
      <stop offset=".55" stop-color="#5a95ff"/>
      <stop offset="1" stop-color="#a6cdff"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20386e"/>
      <stop offset="1" stop-color="#2d4f96"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#343a40" stroke-width="6"/>

  <path d="M100 332c36-62 72-62 108 0s72 62 108 0"
        fill="none" stroke="url(#deep)" stroke-width="42" stroke-linecap="round"/>
  <path d="M100 222c36-62 72-62 108 0s72 62 108 0"
        fill="none" stroke="url(#swell)" stroke-width="56" stroke-linecap="round"/>
  <rect x="356" y="146" width="48" height="166" rx="24" fill="#e8b96f"/>
</svg>
